<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100e22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Pixel Hero</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
        touch-action: none;
        font-family: monospace;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        display: block;
      }

      /* HTML Touch Overlay (shown only on touch devices during gameplay) */
      #touch-controls-overlay {
        position: fixed;
        inset: 0;
        z-index: 500;
        pointer-events: none;
        display: none;
      }
      #touch-controls-overlay.visible {
        display: block;
      }
      .tc-cluster {
        position: fixed;
        pointer-events: auto;
        touch-action: none;
      }
      .tc-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.72);
        background: rgba(18, 22, 42, 0.75);
        color: #fff;
        font-family: monospace;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.55);
        transition: transform 0.04s linear, background-color 0.05s linear;
        user-select: none;
        -webkit-user-select: none;
      }
      .tc-btn.rect {
        border-radius: 14px;
      }
      .tc-btn.active {
        background: rgba(255, 120, 24, 0.88);
        border-color: #ffe030;
        transform: translateY(2px) scale(0.97);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
      }
      .tc-btn.jump-btn {
        background: rgba(34, 96, 200, 0.78);
      }
      .tc-btn.jump-btn.active {
        background: rgba(64, 232, 248, 0.9);
        color: #101020;
      }
      .tc-dpad-zone {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        margin: -12px;
      }
      .tc-joy-base {
        position: relative;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.65);
        background: rgba(18, 22, 42, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tc-joy-knob {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 160, 48, 0.88);
        border: 2px solid #fff;
        pointer-events: none;
      }
      .tc-action-zone {
        position: fixed;
        pointer-events: auto;
        touch-action: none;
        padding: 10px;
      }
      .tc-pause-btn {
        width: 40px;
        height: 40px;
        font-size: 13px;
        border-radius: 10px;
      }
      .tc-layout-bar {
        position: fixed;
        top: calc(10px + var(--sat));
        left: 50%;
        transform: translateX(-50%);
        z-index: 600;
        display: flex;
        gap: 10px;
        background: rgba(16, 14, 34, 0.92);
        border: 2px solid #ffe030;
        border-radius: 8px;
        padding: 8px 12px;
        pointer-events: auto;
      }
      .tc-layout-bar button {
        font-family: monospace;
        font-size: 13px;
        font-weight: bold;
        padding: 8px 14px;
        min-height: 40px;
        border-radius: 6px;
        border: 2px solid #fff;
        background: #2b3a6c;
        color: #fff;
      }

      /* Portrait rotate overlay + resume overlay */
      #rotate-overlay,
      #resume-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 20, 0.95);
        color: #fff;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        text-align: center;
        padding: 24px;
        font-size: 17px;
      }
      .phone-rotate-icon {
        width: 48px;
        height: 80px;
        border: 3px solid #ffe030;
        border-radius: 10px;
        position: relative;
        animation: rotatePhone 1.8s ease-in-out infinite;
      }
      .phone-rotate-icon::after {
        content: '';
        position: absolute;
        bottom: 6px;
        left: 50%;
        width: 10px;
        height: 3px;
        background: #ffe030;
        transform: translateX(-50%);
        border-radius: 2px;
      }
      @keyframes rotatePhone {
        0%,
        20% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      #resume-btn {
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        padding: 14px 28px;
        min-width: 160px;
        min-height: 48px;
        border-radius: 8px;
        border: 2px solid #ffe030;
        background: #284080;
        color: #fff;
      }
      #ios-pwa-tip {
        display: none;
        position: fixed;
        bottom: calc(12px + var(--sab));
        left: 50%;
        transform: translateX(-50%);
        z-index: 900;
        background: rgba(18, 22, 42, 0.95);
        border: 2px solid #40e8f8;
        color: #fff;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 12px;
        max-width: 90vw;
        text-align: center;
      }
      #ios-pwa-tip button {
        margin-left: 10px;
        padding: 4px 10px;
        min-height: 32px;
        background: #ff7818;
        color: #fff;
        border: 1px solid #fff;
        border-radius: 4px;
        font-family: monospace;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="touch-controls-overlay"></div>
    <div id="rotate-overlay">
      <div class="phone-rotate-icon"></div>
      <div>Xoay ngang điện thoại để chơi Pixel Hero</div>
    </div>
    <div id="resume-overlay">
      <div>Đã xoay ngang — Sẵn sàng tiếp tục!</div>
      <button id="resume-btn" type="button">TIẾP TỤC</button>
    </div>
    <div id="ios-pwa-tip">
      <span>Bấm Chia sẻ → Thêm vào Màn hình chính để chơi toàn màn hình</span>
      <button id="ios-pwa-close" type="button">OK</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
